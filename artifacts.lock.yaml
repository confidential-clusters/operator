# cachi2 "generic" fetcher lockfile.
# Prefetches build-time binaries not covered by a language package manager, so the builds
# can run hermetically (network-isolated). During the Konflux build these land under
# /cachi2/output/deps/generic/<filename> and are placed where each build expects them.
#
# The operator Makefile normally `curl`s these exact release assets (then falls back to
# go install / cargo install); prefetching them here and pre-placing them lets `make
# crds-rs` / `make manifests` skip all network access.
#
# Versions must track what the Makefile derives dynamically:
#   controller-gen -> `go list -m sigs.k8s.io/controller-tools` (go.mod, v0.20.1)
#   kopium         -> `cargo metadata` kopium (Cargo.lock, 0.23.0)
#   yq / operator-sdk -> pinned in Containerfile.bundle (v4.48.1 / v1.38.0)
metadata:
  version: "1.0"
artifacts:
  # --- Rust/Go build tools for `make crds-rs` (operands) and `make manifests` (bundle) ---
  - download_url: https://github.com/kubernetes-sigs/controller-tools/releases/download/v0.20.1/controller-gen-linux-amd64
    checksum: "sha256:55ba0a1f7205cb529b03c09af0ee1d37e0ff30544b13569c0bf7873976af6ef3"
    filename: controller-gen-linux-amd64
  # musl (static) build: the gnu build needs GLIBC_2.39, newer than the ubi9 buildroot's
  # glibc 2.34; musl is statically linked and runs anywhere.
  - download_url: https://github.com/kube-rs/kopium/releases/download/0.23.0/kopium-x86_64-unknown-linux-musl.tar.xz
    checksum: "sha256:7882bc8827e630f17862549a9d0479d27d65540014ce7a2d5f31a03a92665c70"
    filename: kopium-x86_64-unknown-linux-musl.tar.xz
  # --- bundle image tooling ---
  - download_url: https://github.com/mikefarah/yq/releases/download/v4.48.1/yq_linux_amd64
    checksum: "sha256:99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f"
    filename: yq_linux_amd64
  - download_url: https://github.com/operator-framework/operator-sdk/releases/download/v1.38.0/operator-sdk_linux_amd64
    checksum: "sha256:35f759010c05aef7fed9deb31a46a6682aedff7abf8c109331ccd931c966e6c0"
    filename: operator-sdk_linux_amd64
